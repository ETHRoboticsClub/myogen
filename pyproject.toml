[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myogen"
version = "0.2.0"
description = "Synthetic forearm sEMG from hand and wrist joint angles, on a musculoskeletal forearm model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mujoco>=3.4", "numpy", "scipy", "h5py", "pyyaml"]

[project.optional-dependencies]
viewer = ["mjviser"]
biomime = ["torch", "gdown"]          # CPU-only torch: add --extra-index-url https://download.pytorch.org/whl/cpu
model-build = ["myo-sim>=0.2.3"]      # only for scripts/build_model.py
test = ["pytest"]

[project.scripts]
myogen = "myogen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
myogen = ["models/*.xml", "models/meshes/*.stl"]
"myogen.engines.biomime.vendor" = ["generator.yaml", "LICENSE", "README.md"]
