# myogen default configuration (packaged). Every command reads a config, so they run without arguments:
#
#   myogen generate | view | inspect | realism | download | ...   (myogen --help for the full list)
#
# Which file: --config <file> > $MYOGEN_CONFIG > ./myogen.yml (myogen init) > these defaults.
# Other files start with `extends: default` (or `extends: <file>`) and list only what they change.
# One-off changes: KEY=VALUE overrides, e.g.  myogen generate generate.subjects=4 generate.live_view=true
#
# Paths: relative paths are relative to the file that sets them; here and in overrides, to the directory the
# command runs in. {data} is paths.data (downloaded / built inputs, see `myogen download`).
# A [lo, hi] pair is sampled uniformly per subject (domain randomisation); a single number fixes the parameter.
# generate copies the resolved config into the dataset (<out>/config.json), and every trial stores the values
# actually sampled (subject_params / session_params).

paths:
  data: ""                                   # "" = $MYOGEN_DATA or the user data dir (~/.local/share/myogen)
  ninapro: "{data}/real"                     # raw NinaPro: ninapro_db1/s*/, ninapro_db5/s*/ (realism, ninapro-bank)
  latent_bank: "{data}/real/latent_bank.h5"  # real NinaPro intent trajectories (download, or ninapro-bank)
  biomime_weights: "{data}/biomime/model_linear.pth"   # BioMime pretrained generator (download biomime-weights)
  muap_bank: "{data}/biomime/muap_bank.h5"   # BioMime MUAP bank (download, or biomime-bank build)

download:                                    # myogen download latent-bank | muap-bank | biomime-weights | all
  base_url: ""                               # where latent_bank.h5 / muap_bank.h5 are hosted (e.g. a Zenodo record's
                                             # files URL); BioMime weights come from the authors' Google Drive

# ---------------------------------------------------------------------------------------------------------
generate:
  out: runs/run1
  subjects: 8
  sessions: 2                 # electrode re-donning, skin, arm posture and support change between sessions
  trials: 2
  duration: 30.0              # s per trial
  amputee_frac: 0.3
  device: raw                 # raw sEMG | otto_bock (NinaPro DB1: 10 ch envelope @100 Hz) | myo (DB5: 16 ch int8 @200 Hz)
  motion: synthetic           # synthetic | ninapro (real glove trajectories, needs paths.latent_bank) | mix
  real_frac: 0.5              # fraction of ninapro motion when motion: mix
  bank_datasets: [db1, db5]
  support: random             # supported (armrest, NinaPro protocol) | free (arm held up) | random (50/50)
  emg_model: analytic         # analytic (fast interference model) | biomime (motor-unit level)
  pool: fuglevand             # biomime motor-unit pool: fuglevand | lif
  save_spikes: false          # biomime: store motor-unit spike trains
  biomime_gain: 1.0           # biomime global amplitude calibration (1 = physical)
  fs_emg: 2000                # output EMG rate for device: raw (otto_bock / myo use their hardware rate)
  fs_sim: 2000                # internal EMG synthesis rate
  fs_label: 100               # labels and control rate
  workers: 0                  # 0 = all cores but two
  seed: 0
  live_view: false            # watch one worker's simulation in the web viewer (view.port) while generating

# ---------------------------------------------------------------------------------------------------------
# Electrode placement, one block per device (the one named by generate.device is used).
#
#   level             ring position along the forearm, fraction of forearm length from the elbow (0 = elbow,
#                     1 = wrist; the model's forearm is ~26 cm)
#   rotation_deg      armband rotation in the forearm frame: ~0 radial border (brachioradialis / ECRL side),
#                     +90 dorsal (extensors), -90 palmar (flexors), +-180 ulnar border
#   per_ring, rings   channels per ring and number of rings; ring r is rotated by half an electrode spacing per
#                     ring (staggered) and placed ring_gap (m) more distally
#   angle_jitter_deg  per-electrode placement irregularity (std)
#   targets           extra electrodes over these muscles' bellies, at target_level (DB1's FDS / EDC spots)
#   ied               inter-electrode distance of each bipolar pair (m)
# Sessions add a random shift on top (rotation ~ 8.6 deg std, level ~ 3 % std) to model re-donning.
#
# Making a parameter fixed instead of a range (or the reverse) changes the random draws that follow it, so
# datasets are reproducible for a given config, not across configs.
electrodes:
  raw:
    per_ring: 8
    rings: 1
    level: [0.15, 0.40]
    level_amputee: [0.12, 0.15]   # amputees: [lo, hi], hi extended up to residual length - amputee_margin
    amputee_margin: 0.12
    ring_gap: 0.035
    rotation_deg: [-180.0, 180.0]
    angle_jitter_deg: [0.0, 4.6]
    ied: [0.015, 0.025]

  otto_bock:                      # NinaPro DB1: 8 equally spaced electrodes at the radio-humeral joint + 2 targeted
    per_ring: 8
    rings: 1
    level: [0.04, 0.14]
    ring_gap: 0.035
    rotation_deg: [-180.0, 180.0]
    angle_jitter_deg: [0.0, 4.6]
    targets: [FDS3_r, EDC3_r]
    target_level: [0.25, 0.40]
    ied: [0.015, 0.025]

  myo:                            # NinaPro DB5: two Myo armbands, the second distal and rotated 22.5 deg
    per_ring: 8
    rings: 2
    level: [0.06, 0.18]
    ring_gap: [0.03, 0.04]
    rotation_deg: [-180.0, 180.0]
    angle_jitter_deg: [0.0, 2.9]
    ied: [0.012, 0.018]

# ---------------------------------------------------------------------------------------------------------
view:                           # myogen view: 3D replay with recording setup and live EMG traces
  mode: replay                  # replay | demo (random natural motion) | live (UDP muscle excitations)
  shard: ""                     # "" = first shard of generate.out
  trial: ""                     # "" = first trial in the shard
  emg_window: 4.0               # s of EMG shown in the scrolling plot
  port: 8080                    # http://localhost:<port> (also used by generate.live_view)

inspect:                        # myogen inspect: PNG of one trial (EMG, envelopes, kinematics, excitations)
  shard: ""
  trial: ""
  seconds: 10.0
  out: trial.png
  muscle: ""                    # myogen inspect-muaps: muscle to plot ("" = first in the bank)

realism:                        # myogen realism: compare generated EMG with NinaPro
  real: db5                     # db1 | db5
  sim: ""                       # "" = generate.out
  out: reports/realism
  max_subjects: 0               # 0 = all

biomime_bank:                   # myogen biomime-bank build | info | regrid
  per_muscle: 128
  seed: 0
  threads: 0                    # 0 = torch default
  z0: 0.06                      # regrid: forearm-length fraction of grid row 0 ...
  z1: 0.42                      # ... and of row 9
