# myogen simulation: one movement recording (latent trajectory) in -> one sEMG recording out.
#
#   python:  mg.simulate(mg.Motion.load("motion.h5"), mg.SimConfig.load("sim.yml"), out="emg.h5")
#   shell:   myogen simulate motion.h5 emg.h5 --config sim.yml
#
# Ranged values: a number fixes the parameter, [lo, hi] draws it uniformly with `seed`, null keeps the
# built-in prior (described in the comment). Relative paths are relative to this file.

seed: 0                       # same motion + config + seed -> same recording

engine:
  name: analytic              # analytic (fast interference model) | biomime (motor-unit level, needs a MUAP bank)
  biomime:                    # read only when name: biomime
    muap_bank: null           # null = <data dir>/biomime/muap_bank.h5 ($MYOGEN_DATA or ~/.local/share/myogen)
    pool: fuglevand           # motor-unit pool model: fuglevand | lif
    gain: 1.0                 # global amplitude (1 = physical; ~6 matches NinaPro DB5 amplitudes)
    save_spikes: false        # store motor-unit spike trains in the output

device:
  name: raw                   # raw (bipolar sEMG at fs) | otto_bock (NinaPro DB1: 10 ch envelope, 100 Hz)
                              # | myo (NinaPro DB5: 2 x 8 ch int8, 200 Hz)
  fs: 2000                    # Hz, raw only (otto_bock and myo use their hardware rate)
  electrodes: {}              # changes to the device's electrode layout, e.g. {rotation_deg: 90, level: 0.3}
                              # (keys: electrodes in myogen's defaults.yml)

subject:
  amputee: false              # transradial amputee: intrinsic hand muscles absent, extrinsic ones atrophied
  residual_length: null       # amputee only: residual forearm fraction; prior [0.35, 0.8]
  forearm_radius_mm: null     # skin radius at the elbow; prior [36, 47] (x 0.92 for amputees)
  fat_mm: null                # subcutaneous fat thickness; prior [2, 8]
  gain_mv: null               # EMG amplitude, mV RMS of a superficial muscle at full drive; prior lognormal ~1.5
  noise_uv: null              # amplifier + skin noise RMS; prior [0.7, 3] (myo dry electrodes: [3, 8])

session:
  support: random             # supported (forearm on an armrest, NinaPro protocol) | free (arm held up) | random
  elbow_angle_deg: null       # held elbow flexion (limb-position effect); prior [40, 103]
  load: null                  # probability of grip-load episodes while the hand is closed; prior [0, 0.5]
  cocontraction: null         # baseline co-contraction while engaged (0..1 of max drive); prior exp(0.02), <= 0.08
